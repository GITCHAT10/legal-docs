name: Sovereign AI Staging Isolation

on:
  pull_request:
    paths:
      - "services/sovereign-ai/**"
      - ".github/workflows/staging-isolation.yml"
  push:
    branches:
      - "feature/sovereign-ai-agent-control-plane"
    paths:
      - "services/sovereign-ai/**"
      - ".github/workflows/staging-isolation.yml"

permissions:
  contents: read

concurrency:
  group: sovereign-ai-staging-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-tests:
    name: Fail-closed routing and isolation tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/sovereign-ai
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      PROJECT_GLASSWING_ACCESS: "FALSE"
      MALDIVES_LOCAL_ENCLAVE: ""
      PII_EXTERNAL_PROCESSING_ALLOWED: "FALSE"
      STAGING_LEDGER_MODE: "ISOLATED_READ_ONLY"
      TELEMETRY_RETENTION_DAYS: "30"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/sovereign-ai/pyproject.toml

      - name: Install service and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e '.[test]'

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Verify staging policy environment
        shell: bash
        run: |
          test "$STAGING_LEDGER_MODE" = "ISOLATED_READ_ONLY"
          test "$TELEMETRY_RETENTION_DAYS" = "30"
          test "$PROJECT_GLASSWING_ACCESS" = "FALSE"
          test -z "$MALDIVES_LOCAL_ENCLAVE"
          test "$PII_EXTERNAL_PROCESSING_ALLOWED" = "FALSE"

      - name: Run sovereign security tests
        run: python -m pytest -q

      - name: Reject accidental production secrets or unsafe flags
        shell: bash
        run: |
          if grep -RInE 'PROJECT_GLASSWING_ACCESS\s*=\s*["'"']?TRUE|PII_EXTERNAL_PROCESSING_ALLOWED\s*=\s*["'"']?TRUE|STAGING_LEDGER_MODE\s*=\s*["'"']?(READ_WRITE|PRODUCTION)' . --exclude='test_model_router.py'; then
            echo "Unsafe production capability detected in staging source or configuration."
            exit 1
          fi
