name: iMOXON Sovereign Audit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Boot Check
      run: NEXGEN_SECRET=audit-test python mnos/boot_check.py

    - name: Run Schema Validation
      run: python validate_schema.py

    - name: Run Lint
      run: ruff check .

    - name: Run Tests
      run: python -m pytest

  auditExpected:
    runs-on: ubuntu-latest
    needs: audit
    steps:
    - name: Audit Status Passthrough
      run: echo "Audit successfully passed. iMOXON Sovereign integrity confirmed."
