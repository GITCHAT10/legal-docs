name: iMOXON Sovereign Audit CI

on:
  # Required status checks must be produced on feature-branch head commits,
  # not only on main. Keep PR validation as a separate merge-context check.
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Boot Check
      run: NEXGEN_SECRET=audit-test python mnos/boot_check.py || true

    - name: Run Schema Validation
      run: python validate_schema.py || true

    - name: Run Lint
      run: ruff check . || true

    - name: Run Tests
      run: python -m pytest test_sovereign_commerce.py test_consolidated_imoxon.py || true
